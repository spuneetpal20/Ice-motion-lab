
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -q icehomeup-source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build APK
        working-directory: icehomeup
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ice-motion-lab-debug-apk
          path: icehomeup/app/build/outputs/apk/debug/app-debug.apk
          
